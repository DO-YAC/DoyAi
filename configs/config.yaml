defaults:
  - models: lstm
  - dataset: forex
  - checkpoint: checkpoint
  - export: export
  - backtest: backtest
  - _self_

learning_rate: 0.0005
epochs: 300
batch_size: 64
num_workers: 4
pin_memory: true

hydra:
  run:
    dir: outputs/${dataset.ticker}_${models.name}/run_${run_number:${dataset.ticker},${models.name}}
  job:
    chdir: false